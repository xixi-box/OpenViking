name: Cache native compilers
description: Cache Cargo intermediates and C++ compiler output with toolchain isolation
inputs:
  target:
    description: Explicit Cargo target or host
    default: host
  component:
    description: Cargo component to cache (cli or ragfs)
    default: cli
  cpp:
    description: Also restore/save the C++ compiler cache
    default: 'false'
runs:
  using: composite
  steps:
    - name: Install ccache
      if: inputs.cpp == 'true'
      shell: bash
      run: |
        if ! command -v ccache >/dev/null; then
          case "$RUNNER_OS" in
            Linux)
              if [ "$(id -u)" = 0 ]; then
                apt-get update && apt-get install -y ccache
              else
                sudo apt-get update && sudo apt-get install -y ccache
              fi ;;
            macOS) brew install ccache ;;
            Windows) choco install ccache --no-progress -y ;;
          esac
        fi
    - name: Fingerprint toolchain
      id: toolchain
      shell: bash
      env:
        CACHE_TARGET: ${{ inputs.target }}
        CACHE_COMPONENT: ${{ inputs.component }}
        CACHE_CPP: ${{ inputs.cpp }}
        CACHE_ACTION_PATH: ${{ github.action_path }}
      run: |
        case "$CACHE_COMPONENT" in
          cli) override=OV_CLI_CARGO_TARGET_DIR ;;
          ragfs) override=OV_RAGFS_CARGO_TARGET_DIR ;;
          *) echo "::error::Unknown Cargo cache component: $CACHE_COMPONENT"; exit 1 ;;
        esac
        if command -v python3 >/dev/null; then python_cmd=python3; else python_cmd=python; fi
        "$python_cmd" "$CACHE_ACTION_PATH/fingerprint.py"
        target_dir="$GITHUB_WORKSPACE/target/$CACHE_COMPONENT"
        # Cargo and Python subprocesses on Windows need a native absolute path.
        if [ "$RUNNER_OS" = Windows ]; then target_dir=$(cygpath -m "$target_dir"); fi
        echo "CARGO_TARGET_DIR=$target_dir" >> "$GITHUB_ENV"
        echo "$override=$target_dir" >> "$GITHUB_ENV"
        echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        if [ "$CACHE_CPP" = true ]; then
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.cache/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=256M" >> "$GITHUB_ENV"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
        fi
    # Only official main runs populate shared caches. PRs, forks and tag builds
    # restore without registering a post-job save. Commit suffixes allow each
    # main revision to save new compiler output into immutable cache entries.
    - uses: actions/cache/restore@v5
      if: github.repository != 'volcengine/OpenViking' || github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git/db
          target/${{ inputs.component }}
        key: cargo-v4-${{ inputs.component }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ steps.toolchain.outputs.cargo }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
        restore-keys: |
          cargo-v4-${{ inputs.component }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ steps.toolchain.outputs.cargo }}-${{ hashFiles('Cargo.lock') }}-
          cargo-v4-${{ inputs.component }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ steps.toolchain.outputs.cargo }}-
    - uses: actions/cache@v5
      if: github.repository == 'volcengine/OpenViking' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git/db
          target/${{ inputs.component }}
        key: cargo-v4-${{ inputs.component }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ steps.toolchain.outputs.cargo }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
        restore-keys: |
          cargo-v4-${{ inputs.component }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ steps.toolchain.outputs.cargo }}-${{ hashFiles('Cargo.lock') }}-
          cargo-v4-${{ inputs.component }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ steps.toolchain.outputs.cargo }}-
    - uses: actions/cache/restore@v5
      if: inputs.cpp == 'true' && (github.repository != 'volcengine/OpenViking' || github.ref != 'refs/heads/main' || github.event_name == 'pull_request')
      with:
        path: .cache/ccache
        key: ccache-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cpp }}-${{ github.sha }}
        restore-keys: |
          ccache-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cpp }}-
    - uses: actions/cache@v5
      if: inputs.cpp == 'true' && github.repository == 'volcengine/OpenViking' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      with:
        path: .cache/ccache
        key: ccache-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cpp }}-${{ github.sha }}
        restore-keys: |
          ccache-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cpp }}-
